[project]
name = "openapi-crud-gen"
version = "0.1.0"
description = "Generate pytest CRUD test skeletons from OpenAPI specs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["openapi", "pytest", "crud", "codegen", "contract-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "jinja2>=3.0",
    "PyYAML>=6.0",
    "openapi-spec-validator>=0.7.0",
]

[project.scripts]
openapi-crud-gen = "openapi_crud_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "requests>=2.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["openapi_crud_gen"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
